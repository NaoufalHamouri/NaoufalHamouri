name: pixel-profile

on:
  schedule:
    # dawn, noon, dusk and night in Tetouan (holds whether Morocco is on UTC+0 or UTC+1)
    - cron: "30 5 * * *"
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - .github/workflows/pixel-profile.yml

permissions:
  contents: write

concurrency:
  group: pixel-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the pixels
        run: python scripts/generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the new frame
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: repaint pixel profile"
            git pull --rebase
            git push
          fi
